<div class="min-h-[100dvh] flex flex-col">
  <header class="sticky top-0 z-[100] bg-orange-600 shadow-md">
    <div
      class="max-w-4xl mx-auto py-4 px-4 flex items-center justify-between gap-4"
    >
      <div class="flex items-center gap-3 min-w-0">
        <div
          class="w-10 h-10 bg-white rounded-xl flex-shrink-0 flex items-center justify-center text-orange-600 shadow-sm"
        >
          <fa-icon [icon]="icons.logo" class="text-xl"></fa-icon>
        </div>
        <div class="min-w-0">
          <h1 class="text-white text-lg font-black leading-none tracking-wide">
            {{ kitchen()?.name }}
          </h1>
          <p
            class="text-[9px] font-bold text-orange-100 uppercase tracking-widest mt-1"
          >
            {{ kitchen()?.tagline }}
          </p>
        </div>
      </div>

      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="relative flex items-center" id="userMenuContainer">
          <button
            (click)="toggleUserMenu()"
            class="z-[110] h-10 w-10 bg-white/20 border border-white/30 rounded-full flex items-center justify-center text-white backdrop-blur-md active:scale-95 transition-all"
          >
            <fa-icon
              [icon]="isLoggedIn() ? icons.userCheck : icons.user"
            ></fa-icon>
          </button>

          <div
            *ngIf="showUserMenu()"
            (click)="showUserMenu.set(false)"
            class="fixed inset-0 bg-transparent z-[100]"
          ></div>

          <div
            *ngIf="showUserMenu()"
            class="absolute right-0 top-12 w-64 bg-white rounded-2xl shadow-2xl border border-gray-100 overflow-hidden z-[110] animate-in fade-in zoom-in-95 duration-200"
          >
            <ng-container *ngIf="isLoggedIn(); else guestOptions">
              <div
                class="px-4 py-4 bg-gray-50/80 border-b border-gray-100 flex items-center gap-3"
              >
                <div
                  class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 flex-shrink-0"
                >
                  <fa-icon [icon]="icons.user" class="text-xs"></fa-icon>
                </div>
                <div class="min-w-0">
                  <p
                    class="text-[9px] font-bold text-gray-400 uppercase tracking-widest leading-none mb-1"
                  >
                    Logged in as
                  </p>
                  <p class="text-xs font-black text-gray-800 truncate">
                    {{ username() || "Customer" }}
                  </p>
                </div>
              </div>

              <div class="p-1.5">
                <button
                  (click)="navigateToOrders()"
                  class="w-full flex items-center gap-3 px-3.5 py-3 text-gray-600 hover:bg-orange-50 rounded-xl transition-all group"
                >
                  <fa-icon
                    [icon]="icons.history"
                    class="text-sm group-hover:text-orange-600"
                  ></fa-icon>
                  <span class="text-[11px] font-black uppercase"
                    >My Orders</span
                  >
                </button>

                <button
                  (click)="logout()"
                  class="w-full flex items-center gap-3 px-3.5 py-3 text-red-500 hover:bg-red-50 rounded-xl transition-all"
                >
                  <fa-icon [icon]="icons.logout" class="text-sm"></fa-icon>
                  <span class="text-[11px] font-black uppercase">Logout</span>
                </button>
              </div>
            </ng-container>

            <ng-template #guestOptions>
              <div class="p-1.5">
                <button
                  (click)="showLoginModal.set(true); showUserMenu.set(false)"
                  class="w-full flex items-center gap-3 px-4 py-4 text-orange-600 hover:bg-orange-50 rounded-xl transition-all group"
                >
                  <div
                    class="w-8 h-8 rounded-full bg-orange-100 flex items-center justify-center text-orange-600 group-hover:bg-orange-600 group-hover:text-white transition-colors"
                  >
                    <fa-icon [icon]="icons.user" class="text-xs"></fa-icon>
                  </div>
                  <span class="text-[11px] font-black uppercase tracking-widest"
                    >Login / Register</span
                  >
                </button>
              </div>
            </ng-template>
          </div>
        </div>

        <button
          #cartButton
          (click)="onViewCart()"
          [disabled]="isCartEmpty()"
          class="relative h-10 px-4 bg-gray-900 text-white rounded-full flex items-center gap-2 active:scale-95 transition-all disabled:opacity-50"
        >
          <fa-icon [icon]="icons.cart"></fa-icon>
          <span class="text-xs font-black hidden sm:inline">Cart</span>

          <span
            *ngIf="!isCartEmpty()"
            [class.animate-badge-pulse]="isBadgePulsing()"
            class="absolute -top-1 -right-1 bg-orange-500 text-white text-[10px] font-black rounded-full h-5 w-5 flex items-center justify-center border-2 border-white shadow-sm"
          >
            {{ displayedCount() }}
          </span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 w-full">
    <div class="mt-8 mb-6 px-2">
      <div class="flex items-center gap-3">
        <div class="w-2 h-8 bg-orange-600 rounded-full"></div>
        <h3 class="text-3xl font-black text-gray-900 tracking-tight">
          Explore Menu
        </h3>
      </div>
      <p class="text-gray-500 text-sm font-medium ml-5 mt-1">
        Freshly prepared dishes, delivered from our kitchen to yours.
      </p>
    </div>

    <div class="px-2 mb-8">
      <div
        class="group relative flex items-center bg-gray-100/50 hover:bg-gray-100/80 focus-within:bg-white focus-within:shadow-xl focus-within:shadow-orange-500/5 focus-within:ring-1 focus-within:ring-orange-500/10 rounded-[2rem] transition-all duration-300 ease-in-out"
      >
        <div
          class="pl-6 flex items-center justify-center text-gray-400 group-focus-within:text-orange-500 transition-colors"
        >
          <fa-icon [icon]="icons.search" class="text-sm"></fa-icon>
        </div>

        <input
          type="text"
          (input)="onSearch($event)"
          [value]="searchTerm()"
          placeholder="Search for something delicious..."
          class="flex-1 py-4 px-4 bg-transparent border-none focus:ring-0 outline-none text-sm font-bold text-gray-800 placeholder:text-gray-400 placeholder:font-medium tracking-tight"
        />

        <button
          *ngIf="searchTerm()"
          (click)="clearSearch()"
          class="pr-3 text-gray-300 hover:text-gray-500 transition-colors animate-in fade-in zoom-in duration-200"
        >
          <div
            class="w-6 h-6 rounded-full bg-gray-200/50 flex items-center justify-center"
          >
            <fa-icon [icon]="icons.close" class="text-[8px]"></fa-icon>
          </div>
        </button>

        <div class="pr-2 relative" id="filterMenuContainer">
          <button
            (click)="toggleFilterMenu()"
            [class.text-orange-600]="activeFilter() !== 'all'"
            [class.bg-orange-50]="activeFilter() !== 'all'"
            class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-orange-600 hover:bg-white rounded-full transition-all active:scale-90"
          >
            <fa-icon [icon]="icons.filter" class="text-xs"></fa-icon>
            <div
              *ngIf="activeFilter() !== 'all'"
              class="absolute top-2 right-2 w-2 h-2 bg-orange-500 rounded-full border border-white"
            ></div>
          </button>

          <div
            *ngIf="showFilterMenu()"
            class="absolute right-0 top-12 w-48 bg-white rounded-2xl shadow-2xl border border-gray-100 py-2 z-[110] animate-in fade-in zoom-in-95 duration-200"
          >
            <div class="py-2 mb-1 border-b border-gray-50 text-center">
              <span
                class="text-[10px] font-black text-gray-400 uppercase tracking-widest"
              >
                Dietary Preferences
              </span>
            </div>

            <button
              (click)="toggleFilter('all')"
              class="w-full flex items-center justify-between px-4 py-3 text-xs font-bold transition-all hover:bg-gray-50"
              [class.text-orange-600]="activeFilter() === 'all'"
            >
              <span>Show All</span>
              <fa-icon
                *ngIf="activeFilter() === 'all'"
                [icon]="icons.check"
              ></fa-icon>
            </button>

            <button
              (click)="toggleFilter('veg')"
              class="w-full flex items-center justify-between px-4 py-3 text-xs font-bold text-green-600 transition-all hover:bg-green-50"
              [class.bg-green-50]="activeFilter() === 'veg'"
            >
              <div class="flex items-center gap-2">
                <div
                  class="w-3 h-3 border-2 border-green-600 p-[2px] flex items-center justify-center"
                >
                  <div class="w-full h-full bg-green-600 rounded-full"></div>
                </div>
                <span>Veg</span>
              </div>
              <fa-icon
                *ngIf="activeFilter() === 'veg'"
                [icon]="icons.check"
              ></fa-icon>
            </button>

            <button
              (click)="toggleFilter('non-veg')"
              class="w-full flex items-center justify-between px-4 py-3 text-xs font-bold text-red-600 transition-all hover:bg-red-50"
              [class.bg-red-50]="activeFilter() === 'non-veg'"
            >
              <div class="flex items-center gap-2">
                <div
                  class="w-3 h-3 border-2 border-red-600 flex items-center justify-center p-[1px]"
                >
                  <div
                    class="w-0 h-0 border-l-[3.5px] border-l-transparent border-r-[3.5px] border-r-transparent border-b-[6px] border-b-red-600"
                  ></div>
                </div>
                <span>Non Veg</span>
              </div>
              <fa-icon
                *ngIf="activeFilter() === 'non-veg'"
                [icon]="icons.check"
              ></fa-icon>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="pb-24">
      <app-menu></app-menu>
    </div>
  </main>
</div>

<a
  [href]="'tel:+91' + kitchen()?.whatsapp"
  class="fixed bottom-6 right-6 z-[60] flex items-center justify-center w-14 h-14 bg-green-500 text-white rounded-2xl shadow-xl hover:bg-green-600 transition-all active:scale-90 md:w-auto md:px-6 md:gap-3"
>
  <fa-icon [icon]="icons.phone" class="text-xl"></fa-icon>
  <span class="hidden md:inline font-black text-sm uppercase tracking-wider"
    >Call Kitchen</span
  >
</a>

<app-otp-login
  *ngIf="showLoginModal()"
  (close)="showLoginModal.set(false)"
  (success)="onLoginSuccess()"
></app-otp-login>

<div
  *ngIf="flyingItem()"
  [style.left.px]="flyX()"
  [style.top.px]="flyY()"
  [ngStyle]="flyStyle()"
  class="fixed w-12 h-12 z-[150] pointer-events-none transition-all duration-700 ease-in-out"
>
  <img
    [src]="flyingItem()?.imageUrl"
    (error)="onImageError($event)"
    class="w-full h-full object-cover rounded-full border-2 border-white shadow-lg"
  />
</div>
