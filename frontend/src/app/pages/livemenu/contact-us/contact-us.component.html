<div class="py-20 px-6 text-center bg-gray-50/50 border-b border-gray-100">
  <span
    class="px-4 py-2 bg-orange-100 text-orange-700 rounded-full text-[10px] font-black uppercase tracking-[0.2em]"
  >
    Get In Touch
  </span>
  <h1 class="text-4xl md:text-5xl font-black text-gray-900 mt-6 tracking-tight">
    We're here to help your <br /><span class="text-orange-600"
      >kitchen grow.</span
    >
  </h1>
</div>

<div
  class="max-w-6xl mx-auto px-6 py-20 grid grid-cols-1 lg:grid-cols-2 gap-16"
>
  <div class="space-y-12">
    <div>
      <h3
        class="text-xl font-black text-gray-900 uppercase tracking-widest mb-6"
      >
        Contact Channels
      </h3>
      <div class="space-y-6">
        <div class="flex items-start gap-5 group">
          <div
            class="w-12 h-12 rounded-2xl bg-green-50 text-green-600 flex items-center justify-center shrink-0 transition-colors group-hover:bg-green-600 group-hover:text-white"
          >
            <fa-icon [icon]="icons.whatsapp" class="text-xl"></fa-icon>
          </div>
          <div>
            <p
              class="text-[10px] font-black uppercase tracking-widest text-gray-400"
            >
              WhatsApp Support
            </p>
            <p class="text-lg font-bold text-gray-900">+91 93345 27565</p>
          </div>
        </div>

        <div class="flex items-start gap-5 group">
          <div
            class="w-12 h-12 rounded-2xl bg-orange-50 text-orange-600 flex items-center justify-center shrink-0 transition-colors group-hover:bg-orange-600 group-hover:text-white"
          >
            <fa-icon [icon]="icons.envelope" class="text-xl"></fa-icon>
          </div>
          <div>
            <p
              class="text-[10px] font-black uppercase tracking-widest text-gray-400"
            >
              Email Enquiries
            </p>
            <p class="text-lg font-bold text-gray-900">
              support&#64;livemenu.in
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="p-8 bg-gray-900 rounded-[2.5rem] text-white">
      <h4 class="text-lg font-black mb-2">Need a quick answer?</h4>
      <p class="text-sm text-gray-400 leading-relaxed mb-6">
        Check our documentation for guides on setting up your categories, menu
        items, and printers.
      </p>
      <button
        class="text-xs font-black uppercase tracking-widest text-orange-500 hover:text-orange-400 transition-colors"
      >
        Browse Knowledge Base →
      </button>
    </div>
  </div>

  <div
    class="bg-white p-10 rounded-[3rem] border border-gray-100 shadow-2xl shadow-gray-200/50"
  >
    <form class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label
            class="text-[10px] font-black uppercase text-gray-400 ml-2 tracking-widest"
            >Full Name</label
          >
          <input
            type="text"
            placeholder="John Doe"
            class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-orange-500/20 focus:bg-white rounded-2xl text-sm font-bold transition-all outline-none"
          />
        </div>
        <div class="space-y-2">
          <label
            class="text-[10px] font-black uppercase text-gray-400 ml-2 tracking-widest"
            >Phone Number</label
          >
          <input
            type="tel"
            placeholder="+91 ..."
            class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-orange-500/20 focus:bg-white rounded-2xl text-sm font-bold transition-all outline-none"
          />
        </div>
      </div>

      <div class="space-y-2">
        <label
          class="text-[10px] font-black uppercase text-gray-400 ml-2 tracking-widest"
          >Kitchen / Brand Name</label
        >
        <input
          type="text"
          placeholder="e.g. Taco Street"
          class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-orange-500/20 focus:bg-white rounded-2xl text-sm font-bold transition-all outline-none"
        />
      </div>

      <div class="space-y-2">
        <label
          class="text-[10px] font-black uppercase text-gray-400 ml-2 tracking-widest"
          >Message</label
        >
        <textarea
          rows="4"
          placeholder="How can we help you?"
          class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-orange-500/20 focus:bg-white rounded-2xl text-sm font-bold transition-all outline-none resize-none"
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full py-5 bg-orange-600 text-white rounded-[1.8rem] font-black uppercase tracking-widest shadow-xl shadow-orange-100 hover:bg-orange-700 active:scale-95 transition-all"
      >
        Send Message
      </button>
    </form>
  </div>
</div>
