<div class="min-h-screen bg-white">
  <nav
    class="h-20 flex items-center justify-between px-6 md:px-12 border-b border-gray-50 bg-white/80 backdrop-blur-md sticky top-0 z-50"
  >
    <div
      [routerLink]="['/']"
      fragment="home"
      class="flex items-center cursor-pointer gap-2 group"
    >
      <fa-icon
        [icon]="icons.logo"
        class="text-orange-600 text-2xl transition-transform group-hover:scale-110"
      ></fa-icon>
      <span class="text-xl font-black text-gray-900 tracking-tight"
        >LiveMenu</span
      >
    </div>

    <div
      class="hidden md:flex items-center gap-8 text-[11px] font-black uppercase tracking-widest"
    >
      <a
        [routerLink]="['/']"
        fragment="features"
        class="text-gray-500 hover:text-orange-600 transition-colors relative"
      >
        Features
      </a>

      <a
        [routerLink]="['/']"
        fragment="contact"
        class="text-gray-500 hover:text-orange-600 transition-colors"
      >
        Contact
      </a>
    </div>
  </nav>

  <main class="animate-in fade-in duration-500">
    <router-outlet></router-outlet>
  </main>

  <footer class="py-12 px-6 border-t border-gray-50 bg-white">
    <div
      class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6"
    >
      <div class="flex items-center gap-2 grayscale opacity-50">
        <fa-icon [icon]="icons.logo"></fa-icon>
        <span class="font-black">LiveMenu</span>
      </div>

      <div
        class="flex gap-8 text-[10px] font-black uppercase tracking-widest text-gray-400"
      >
        <a
          routerLink="/terms-of-service"
          routerLinkActive="text-orange-600"
          class="hover:text-orange-600 transition-colors"
          >Terms of Service</a
        >
        <a
          routerLink="/privacy-policy"
          routerLinkActive="text-orange-600"
          class="hover:text-orange-600 transition-colors"
          >Privacy Policy</a
        >
      </div>

      <p class="text-[10px] text-gray-300 font-bold uppercase tracking-widest">
        © 2026 LiveMenu
      </p>
    </div>
  </footer>
</div>
