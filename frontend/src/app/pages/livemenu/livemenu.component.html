<div class="min-h-screen bg-white">
  <nav
    class="h-20 flex items-center justify-between px-6 md:px-12 border-b border-gray-50"
  >
    <div routerLink="/" class="flex items-center cursor-pointer gap-2">
      <fa-icon [icon]="icons.logo" class="text-orange-600 text-2xl"></fa-icon>
      <span class="text-xl font-black text-gray-900 tracking-tight"
        >LiveMenu</span
      >
    </div>
    <div
      class="hidden md:flex items-center gap-8 text-sm font-black uppercase tracking-widest text-gray-500"
    >
      <a routerLink="/features" class="hover:text-orange-600 transition-colors"
        >Features</a
      >
      <a
        routerLink="/contact-us"
        class="hover:text-orange-600 transition-colors"
        >Contact</a
      >
      <a
        routerLink="/login"
        class="px-6 py-3 bg-gray-900 text-white rounded-2xl active:scale-95 transition-all"
        >Sign In</a
      >
    </div>
  </nav>
  <router-outlet></router-outlet>
</div>
