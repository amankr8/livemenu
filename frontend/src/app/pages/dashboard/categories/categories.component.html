<div class="space-y-6 animate-in fade-in duration-500">
  <!-- Header Action Area -->
  <div
    class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm"
  >
    <div>
      <h3 class="text-lg font-black text-gray-900 tracking-tight">
        Menu Categories
      </h3>
      <p class="text-[11px] text-gray-400 font-bold uppercase tracking-widest">
        Organize your dishes for better visibility
      </p>
    </div>
    <button
      (click)="openAddModal()"
      class="flex items-center gap-2 px-6 py-3 bg-orange-600 text-white rounded-2xl text-[11px] font-black uppercase tracking-widest hover:bg-orange-700 active:scale-95 transition-all shadow-md shadow-orange-100"
    >
      <fa-icon [icon]="icons.plus"></fa-icon>
      <span>Add Category</span>
    </button>
  </div>

  <!-- Main Category List -->
  <div class="space-y-3">
    <div
      *ngIf="categoryService.loading()"
      class="grid grid-cols-1 md:grid-cols-2 gap-4"
    >
      <div
        *ngFor="let i of [1, 2, 3, 4]"
        class="h-20 bg-white rounded-3xl animate-pulse border border-gray-50"
      ></div>
    </div>

    <div
      *ngIf="!categoryService.loading()"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
    >
      <div
        *ngFor="let cat of categoryService.categories()"
        class="group bg-white rounded-[1.8rem] p-5 border border-gray-100 flex items-center justify-between hover:border-orange-200 hover:shadow-lg hover:shadow-orange-500/5 transition-all"
      >
        <div class="flex items-center gap-4">
          <div
            class="w-12 h-12 rounded-2xl bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-orange-50 group-hover:text-orange-600 transition-colors"
          >
            <fa-icon [icon]="icons.tag"></fa-icon>
          </div>
          <span class="text-sm font-black text-gray-800 tracking-tight">{{
            cat.name
          }}</span>
        </div>
        <div
          class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity"
        >
          <button
            (click)="startEdit(cat)"
            class="w-9 h-9 flex items-center justify-center text-gray-400 hover:text-orange-600 hover:bg-orange-50 rounded-xl transition-all"
          >
            <fa-icon [icon]="icons.edit" class="text-xs"></fa-icon>
          </button>
          <button
            (click)="onDelete(cat)"
            class="w-9 h-9 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all"
          >
            <fa-icon [icon]="icons.delete" class="text-xs"></fa-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div
    *ngIf="showModal()"
    class="fixed inset-0 z-[150] flex items-center justify-center p-4 animate-in fade-in duration-200"
  >
    <div
      class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm"
      (click)="closeModal()"
    ></div>

    <div
      class="relative w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300"
    >
      <div class="p-8">
        <div class="flex items-center gap-4 mb-8">
          <div
            class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center text-xl"
          >
            <fa-icon [icon]="isEditing() ? icons.edit : icons.plus"></fa-icon>
          </div>
          <div>
            <h2 class="text-xl font-black text-gray-900 leading-tight">
              {{ isEditing() ? "Update" : "New" }} Category
            </h2>
            <p
              class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em]"
            >
              LiveMenu Configuration
            </p>
          </div>
        </div>

        <div class="space-y-6">
          <div>
            <label
              class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1"
              >Category Name</label
            >
            <input
              type="text"
              [(ngModel)]="categoryName"
              placeholder="e.g. Main Course"
              class="w-full mt-2 px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-orange-500/20 focus:bg-white rounded-2xl text-sm font-bold transition-all outline-none"
            />
          </div>

          <div class="flex gap-3 pt-2">
            <button
              (click)="closeModal()"
              class="flex-1 py-4 bg-gray-100 text-gray-500 rounded-2xl text-[11px] font-black uppercase tracking-widest hover:bg-gray-200 transition-all"
            >
              Cancel
            </button>
            <button
              (click)="onSaveCategory()"
              [disabled]="!categoryName().trim() || isSubmitting()"
              class="flex-[2] py-4 bg-gray-900 text-white rounded-2xl text-[11px] font-black uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 transition-all shadow-xl shadow-gray-200"
            >
              <fa-icon
                *ngIf="isSubmitting()"
                [icon]="icons.spinner"
                [animation]="'spin'"
              ></fa-icon>
              <span>{{
                isEditing() ? "Save Changes" : "Create Category"
              }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
