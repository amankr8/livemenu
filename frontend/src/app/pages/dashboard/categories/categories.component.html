<div class="space-y-6 animate-in fade-in duration-500">
  <!-- Slim Action Bar -->
  <div
    class="flex items-center justify-between bg-white p-4 rounded-[1.5rem] border border-gray-100 shadow-sm"
  >
    <div class="px-2">
      <span
        class="text-[11px] font-black uppercase tracking-[0.2em] text-gray-400"
      >
        Total Categories ({{ categories()?.length || 0 }})
      </span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Refresh Button -->
      <button
        (click)="refresh()"
        class="w-10 h-10 flex items-center justify-center text-gray-400 hover:text-orange-500 hover:bg-orange-50 rounded-xl transition-all"
        title="Refresh List"
      >
        <fa-icon
          [icon]="icons.refresh"
          [class.animate-spin]="loading()"
        ></fa-icon>
      </button>

      <!-- Primary Add Button -->
      <button
        (click)="openAddModal()"
        class="flex items-center gap-2 px-5 py-2.5 bg-gray-900 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-orange-600 active:scale-95 transition-all shadow-md shadow-gray-200"
      >
        <fa-icon [icon]="icons.plus"></fa-icon>
        <span>Add New</span>
      </button>
    </div>
  </div>

  <!-- Main Category List (Grid) -->
  <div class="space-y-3">
    <!-- Loading Skeleton -->
    <div
      *ngIf="loading() && !categories()?.length"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
    >
      <div
        *ngFor="let i of [1, 2, 3, 4, 5, 6]"
        class="h-24 bg-white rounded-[1.8rem] animate-pulse border border-gray-50"
      ></div>
    </div>

    <!-- Data Grid -->
    <div
      *ngIf="!loading()"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
    >
      <div
        *ngFor="let cat of categories()"
        class="group bg-white rounded-[1.8rem] p-5 border border-gray-100 flex items-center justify-between hover:border-orange-200 hover:shadow-lg hover:shadow-orange-500/5 transition-all"
      >
        <div class="flex items-center gap-4">
          <div class="relative">
            <div
              class="w-12 h-12 rounded-2xl bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-orange-50 group-hover:text-orange-600 transition-colors"
            >
              <fa-icon [icon]="icons.tag"></fa-icon>
            </div>
            <!-- Item Count Badge -->
            <span
              [class]="
                getItemCount(cat.id) > 0
                  ? 'bg-orange-500 text-white'
                  : 'bg-gray-200 text-gray-400'
              "
              class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 flex items-center justify-center rounded-lg text-[8px] font-black border-2 border-white"
            >
              {{ getItemCount(cat.id) }}
            </span>
          </div>
          <div>
            <span
              class="text-sm font-black text-gray-800 tracking-tight block"
              >{{ cat.name }}</span
            >
            <span
              class="text-[9px] font-bold uppercase tracking-widest text-gray-400"
            >
              {{
                getItemCount(cat.id) === 1
                  ? "1 Dish"
                  : getItemCount(cat.id) + " Dishes"
              }}
            </span>
          </div>
        </div>

        <div
          class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-all transform translate-x-2 group-hover:translate-x-0"
        >
          <button
            (click)="startEdit(cat)"
            class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-orange-600 hover:bg-orange-50 rounded-lg transition-all"
          >
            <fa-icon [icon]="icons.edit" class="text-[10px]"></fa-icon>
          </button>
          <button
            (click)="onDelete(cat)"
            class="w-8 h-8 flex items-center justify-center text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all"
          >
            <fa-icon [icon]="icons.delete" class="text-[10px]"></fa-icon>
          </button>
        </div>
      </div>

      <!-- Empty State -->
      <div
        *ngIf="!categories()?.length"
        class="col-span-full py-20 text-center bg-white rounded-[2.5rem] border-2 border-dashed border-gray-100"
      >
        <div
          class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-200"
        >
          <fa-icon [icon]="icons.tag" class="text-2xl"></fa-icon>
        </div>
        <p class="text-xs font-black text-gray-400 uppercase tracking-widest">
          No Categories Found
        </p>
      </div>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div
    *ngIf="showModal()"
    class="fixed inset-0 z-[150] flex items-center justify-center p-4 animate-in fade-in duration-200"
  >
    <div
      class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm"
      (click)="closeModal()"
    ></div>

    <div
      class="relative w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300"
    >
      <div class="p-8">
        <div class="flex items-center gap-4 mb-8">
          <div
            class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center text-xl"
          >
            <fa-icon [icon]="isEditing() ? icons.edit : icons.tag"></fa-icon>
          </div>
          <div>
            <h2 class="text-xl font-black text-gray-900 leading-tight">
              {{ isEditing() ? "Update" : "New" }} Category
            </h2>
            <p
              class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em]"
            >
              LiveMenu Configuration
            </p>
          </div>
        </div>

        <div class="space-y-6">
          <div>
            <label
              class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1"
              >Category Name</label
            >
            <input
              type="text"
              [(ngModel)]="categoryName"
              placeholder="e.g. Main Course"
              class="w-full mt-2 px-6 py-4 bg-gray-50 border-2 border-transparent focus:border-orange-500/20 focus:bg-white rounded-2xl text-sm font-bold transition-all outline-none"
            />
          </div>

          <div class="flex gap-3 pt-2">
            <button
              (click)="closeModal()"
              class="flex-1 py-4 bg-gray-100 text-gray-500 rounded-2xl text-[11px] font-black uppercase tracking-widest hover:bg-gray-200 transition-all"
            >
              Cancel
            </button>
            <button
              (click)="onSaveCategory()"
              [disabled]="!categoryName().trim() || isSubmitting()"
              class="flex-[2] py-4 bg-gray-900 text-white rounded-2xl text-[11px] font-black uppercase tracking-widest flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 transition-all shadow-xl shadow-gray-200"
            >
              <fa-icon
                *ngIf="isSubmitting()"
                [icon]="icons.spinner"
                [animation]="'spin'"
              ></fa-icon>
              <span>{{
                isEditing() ? "Save Changes" : "Create Category"
              }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
