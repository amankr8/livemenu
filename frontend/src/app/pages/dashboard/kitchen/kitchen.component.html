<div class="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
  <div
    class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"
  >
    <div class="p-8 border-b border-gray-50 bg-gray-50/30">
      <h3 class="text-xl font-bold text-gray-900">General Information</h3>
      <p class="text-sm text-gray-500 mt-1">
        This information will be visible to your customers on the live menu.
      </p>
    </div>

    <form
      [formGroup]="kitchenForm"
      (ngSubmit)="onUpdate()"
      class="p-8 space-y-8"
    >
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        <label
          class="text-sm font-bold text-gray-700 uppercase tracking-wider mt-2"
          >Kitchen Name</label
        >
        <div class="md:col-span-2">
          <input
            formControlName="name"
            type="text"
            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:bg-white outline-none transition-all"
          />
        </div>
      </div>

      <hr class="border-gray-50" />

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        <label
          class="text-sm font-bold text-gray-700 uppercase tracking-wider mt-2"
          >Tagline</label
        >
        <div class="md:col-span-2">
          <input
            formControlName="tagline"
            type="text"
            placeholder="e.g. Authentic Street Tacos"
            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:bg-white outline-none transition-all"
          />
        </div>
      </div>

      <hr class="border-gray-50" />

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        <label
          class="text-sm font-bold text-gray-700 uppercase tracking-wider mt-2"
          >Address</label
        >
        <div class="md:col-span-2">
          <textarea
            formControlName="address"
            rows="3"
            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:bg-white outline-none transition-all"
          ></textarea>
        </div>
      </div>

      <hr class="border-gray-50" />

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        <label
          class="text-sm font-bold text-gray-700 uppercase tracking-wider mt-2"
          >Contact Number</label
        >
        <div class="md:col-span-2">
          <div class="flex">
            <span
              class="inline-flex items-center px-4 rounded-l-xl border border-r-0 border-gray-200 bg-gray-100 text-gray-500 font-bold"
            >
              +91
            </span>
            <input
              formControlName="whatsapp"
              type="text"
              class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-r-xl focus:ring-2 focus:ring-orange-500 focus:bg-white outline-none transition-all"
            />
          </div>
          <p
            *ngIf="
              kitchenForm.get('whatsapp')?.touched &&
              kitchenForm.get('whatsapp')?.invalid
            "
            class="mt-2 text-xs text-red-500 font-semibold flex items-center gap-1"
          >
            <fa-icon [icon]="icons.outOfStock"></fa-icon> Please enter a valid
            10-digit number.
          </p>
        </div>
      </div>

      <hr class="border-gray-50" />

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
        <label
          class="text-sm font-bold text-gray-700 uppercase tracking-wider mt-2"
          >Location Coordinates</label
        >
        <div class="md:col-span-2 space-y-4">
          <div>
            <div class="flex items-end gap-2">
              <div class="flex-1">
                <label class="block text-xs text-gray-600 font-semibold mb-2">Coordinates (lat,lng)</label>
                <input
                  formControlName="location"
                  type="text"
                  placeholder="e.g. 28.6139,77.2090"
                  readonly
                  class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:bg-white outline-none transition-all cursor-not-allowed"
                />
              </div>
              <button
                type="button"
                (click)="onLocateMe()"
                class="px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all transform active:scale-95 flex items-center gap-2"
              >
                <fa-icon [icon]="icons.mapMarker"></fa-icon>
                <span>Locate Me</span>
              </button>
            </div>
            <p class="mt-1 text-xs text-gray-500">
              Click "Locate Me" to automatically fill your kitchen's location coordinates.
            </p>
            <p
              *ngIf="
                kitchenForm.get('location')?.touched &&
                kitchenForm.get('location')?.invalid
              "
              class="mt-2 text-xs text-red-500 font-semibold flex items-center gap-1"
            >
              <fa-icon [icon]="icons.outOfStock"></fa-icon> Location coordinates are required (format: lat,lng).
            </p>
          </div>
        </div>
      </div>

      <div class="pt-6 flex justify-end">
        <button
          type="submit"
          [disabled]="kitchenForm.invalid || !kitchenForm.dirty || saving()"
          class="min-w-[160px] px-8 py-3 bg-orange-600 hover:bg-orange-700 text-white font-black rounded-xl shadow-lg shadow-orange-200 transition-all transform active:scale-95 disabled:bg-gray-200 disabled:text-gray-400 disabled:shadow-none flex items-center justify-center gap-2"
        >
          <ng-container *ngIf="saving(); else defaultBtn">
            <fa-icon [icon]="icons.spinner" [animation]="'spin'"></fa-icon>
            <span>Saving...</span>
          </ng-container>

          <ng-template #defaultBtn>
            <fa-icon [icon]="icons.success"></fa-icon>
            <span>Save Changes</span>
          </ng-template>
        </button>
      </div>
    </form>
  </div>
</div>
