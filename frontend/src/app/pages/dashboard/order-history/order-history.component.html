<div class="space-y-6">
  <div class="flex p-1 bg-gray-100 rounded-2xl w-full max-w-md">
    <button
      (click)="setTab('fulfilled')"
      [class]="
        activeTab() === 'fulfilled'
          ? 'bg-white text-orange-600 shadow-sm'
          : 'text-gray-500 hover:text-gray-700'
      "
      class="flex-1 py-3 text-xs font-black uppercase tracking-widest rounded-xl transition-all"
    >
      Fulfilled
    </button>
    <button
      (click)="setTab('cancelled')"
      [class]="
        activeTab() === 'cancelled'
          ? 'bg-white text-red-600 shadow-sm'
          : 'text-gray-500 hover:text-gray-700'
      "
      class="flex-1 py-3 text-xs font-black uppercase tracking-widest rounded-xl transition-all"
    >
      Cancelled
    </button>
  </div>

  <div *ngIf="loading()" class="py-20 text-center text-gray-400">
    <fa-icon
      [icon]="icons.spinner"
      [animation]="'spin'"
      class="text-2xl mb-2"
    ></fa-icon>
    <p class="text-xs font-bold uppercase tracking-widest">
      Loading History...
    </p>
  </div>

  <div
    *ngIf="!loading() && displayOrders().length === 0"
    class="py-20 bg-white rounded-[2.5rem] border-2 border-dashed border-gray-100 flex flex-col items-center justify-center"
  >
    <div
      class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center text-gray-300 mb-4"
    >
      <fa-icon [icon]="icons.history" class="text-xl"></fa-icon>
    </div>
    <h3 class="text-lg font-black text-gray-800">No Orders Found</h3>
    <p class="text-sm text-gray-400">
      There are no {{ activeTab() }} orders to show.
    </p>
  </div>

  <div *ngIf="!loading() && displayOrders().length > 0" class="grid gap-4">
    <div
      *ngFor="let order of displayOrders()"
      class="bg-white border border-gray-100 p-6 rounded-[2rem] hover:shadow-xl hover:shadow-gray-200/40 transition-all group"
    >
      <div class="flex justify-between items-start mb-4">
        <div>
          <span
            class="text-[10px] font-black text-orange-500 uppercase tracking-widest bg-orange-50 px-3 py-1 rounded-full"
          >
            #{{ order.id }}
          </span>
          <h4 class="text-lg font-black text-gray-900 mt-2">
            {{ order.customerName }}
          </h4>
          <p class="text-xs text-gray-400 font-bold">
            {{ order.createdAt | date: "medium" }}
          </p>
        </div>
        <div class="text-right">
          <p class="text-xl font-black text-gray-900">
            ₹{{ order.totalAmount }}
          </p>
          <span
            [class]="
              activeTab() === 'fulfilled' ? 'text-green-500' : 'text-red-500'
            "
            class="text-[9px] font-black uppercase tracking-widest"
          >
            {{ order.status }}
          </span>
        </div>
      </div>

      <div class="border-t border-gray-50 pt-4">
        <p
          class="text-[10px] font-black text-gray-300 uppercase tracking-widest mb-2"
        >
          Order Items
        </p>
        <div class="flex flex-wrap gap-2">
          <span
            *ngFor="let item of order.orderItems"
            class="text-[11px] font-bold bg-gray-50 text-gray-600 px-3 py-1.5 rounded-xl border border-gray-100"
          >
            {{ item.quantity }} x {{ item.menuItemId }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
