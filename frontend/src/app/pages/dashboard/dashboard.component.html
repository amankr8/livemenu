<div
  *ngIf="!isSidebarCollapsed()"
  (click)="toggleSidebar()"
  class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-40 md:hidden animate-in fade-in duration-300"
></div>
<div class="h-screen flex flex-col bg-gray-50 overflow-hidden">
  <header
    class="sticky top-0 h-16 bg-white border-b border-gray-100 p-4 flex justify-between items-center z-30"
  >
    <div class="flex items-center gap-4">
      <div
        routerLink="/"
        class="flex items-center gap-2 cursor-pointer group relative"
      >
        <div
          class="p-2 rounded-xl group-hover:bg-orange-50 transition-all duration-500"
        >
          <fa-icon
            [icon]="icons.logo"
            class="text-orange-600 text-xl block transition-transform duration-500 group-hover:rotate-[15deg] group-hover:scale-110"
          ></fa-icon>
        </div>

        <span
          class="text-orange-600 font-black text-xl tracking-tight transition-all duration-500 group-hover:tracking-normal group-hover:text-orange-500 relative"
        >
          LiveMenu
          <span
            class="absolute bottom-1 left-0 w-0 h-0.5 bg-orange-500 transition-all duration-500 group-hover:w-full"
          ></span>
        </span>
      </div>
    </div>

    <div class="flex items-center gap-6">
      <div class="hidden sm:flex flex-col items-end">
        <span class="text-sm font-bold text-gray-800">
          {{ this.kitchen()?.name }}
        </span>
        <span class="text-[10px] text-gray-400 uppercase font-bold text-right"
          >Kitchen Owner</span
        >
      </div>

      <button
        (click)="onLogout()"
        class="flex items-center gap-2 px-4 py-2 text-sm font-bold text-red-500 hover:bg-red-50 rounded-xl transition-all active:scale-95"
      >
        <fa-icon [icon]="icons.logout"></fa-icon>
        <span class="inline">Logout</span>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside
      [class.w-64]="!isSidebarCollapsed()"
      [class.w-20]="isSidebarCollapsed()"
      [class.-translate-x-full]="isSidebarCollapsed()"
      [class.translate-x-0]="!isSidebarCollapsed()"
      class="bg-white border-r border-gray-100 p-4 flex flex-col transition-all duration-300 ease-in-out z-50 fixed inset-y-0 left-0 md:relative md:translate-x-0"
      [class.overflow-y-auto]="!isSidebarCollapsed()"
      [class.overflow-visible]="isSidebarCollapsed()"
    >
      <nav class="space-y-2 flex-1">
        <a
          *ngFor="let link of navLinks"
          [routerLink]="link.path"
          (click)="closeOnMobile()"
          routerLinkActive="bg-orange-50 text-orange-600 shadow-sm shadow-orange-100/50 is-active"
          #rla="routerLinkActive"
          class="flex items-center h-12 rounded-xl text-gray-600 font-semibold transition-all hover:bg-gray-50 group overflow-visible relative"
        >
          <div
            *ngIf="rla.isActive"
            class="absolute left-0 top-3 bottom-3 w-1 bg-orange-500 rounded-r-full z-10"
          ></div>

          <div class="w-12 h-12 shrink-0 grid place-items-center">
            <fa-icon
              [icon]="link.icon"
              class="text-lg transition-transform group-hover:scale-110"
            ></fa-icon>
          </div>

          <span
            *ngIf="!isSidebarCollapsed()"
            class="flex-1 uppercase text-[11px] font-black tracking-wider whitespace-nowrap animate-in fade-in slide-in-from-left-2 duration-300"
          >
            {{ link.label }}
          </span>

          <div
            *ngIf="isSidebarCollapsed()"
            class="absolute left-full ml-4 px-3 py-2 bg-gray-900 text-white text-[10px] font-black uppercase tracking-widest rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 group-hover:translate-x-1 transition-all z-[100] whitespace-nowrap shadow-xl"
          >
            {{ link.label }}
            <div
              class="absolute -left-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-gray-900 rotate-45"
            ></div>
          </div>

          <span
            *ngIf="!isSidebarCollapsed() && link.showPulse"
            class="w-2 h-2 bg-orange-500 rounded-full animate-pulse mr-4"
          ></span>
        </a>
      </nav>

      <div class="pt-4 mt-auto border-t border-gray-50 flex flex-col gap-4">
        <button
          (click)="toggleSidebar()"
          class="group relative flex items-center h-12 w-full rounded-xl text-gray-400 hover:bg-gray-50 hover:text-orange-600 transition-all active:scale-95"
        >
          <div class="w-12 h-12 shrink-0 grid place-items-center">
            <fa-icon
              [icon]="icons.faArrowLeft"
              [class.rotate-180]="isSidebarCollapsed()"
              class="text-sm transition-transform duration-500 ease-in-out"
            ></fa-icon>
          </div>

          <span
            *ngIf="!isSidebarCollapsed()"
            class="text-[10px] font-black uppercase tracking-widest animate-in fade-in slide-in-from-left-2"
          >
            Collapse Sidebar
          </span>

          <div
            *ngIf="isSidebarCollapsed()"
            class="absolute left-full ml-4 px-3 py-2 bg-gray-900 text-white text-[10px] font-black uppercase tracking-widest rounded-lg opacity-0 pointer-events-none group-hover:opacity-100 group-hover:translate-x-1 transition-all z-[100] whitespace-nowrap shadow-xl"
          >
            Expand
            <div
              class="absolute -left-1 top-1/2 -translate-y-1/2 w-2 h-2 bg-gray-900 rotate-45"
            ></div>
          </div>
        </button>

        <p
          *ngIf="!isSidebarCollapsed()"
          class="text-[9px] font-bold text-gray-300 uppercase text-center tracking-widest whitespace-nowrap animate-in fade-in"
        >
          v1.0 LiveMenu
        </p>
      </div>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-y-auto scroll-smooth">
      <div class="max-w-5xl mx-auto pb-6">
        <div class="mb-10">
          <div
            class="flex items-center gap-2 text-xs font-bold text-gray-400 uppercase tracking-widest mb-1"
          >
            <fa-icon [icon]="icons.kitchen"></fa-icon> <span>Dashboard</span>

            <ng-container
              *ngFor="let crumb of getBreadcrumbs(); let last = last"
            >
              <span class="text-gray-300">/</span>
              <span [class.text-orange-500]="last">{{ crumb }}</span>
            </ng-container>
          </div>

          <h2
            class="text-4xl font-black text-gray-900 capitalize tracking-tight"
          >
            {{ getPageRouteName() }}
          </h2>
        </div>

        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
